version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ironlab
      POSTGRES_PASSWORD: ironlab123
      POSTGRES_DB: ironlab
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d   # cria as tabelas no primeiro start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironlab -d ironlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ironlab:ironlab123@db:5432/ironlab
      JWT_SECRET: ${JWT_SECRET:-ironlab_super_secret_change_in_production}
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
