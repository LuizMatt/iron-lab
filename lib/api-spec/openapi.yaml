openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: IRONLAB Academia API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: workouts
    description: Workout management
  - name: gamification
    description: Gamification and streaks
  - name: payments
    description: Payment management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List all users
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /workouts:
    get:
      operationId: getWorkouts
      tags: [workouts]
      summary: Get workouts (assigned to student or all for admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workout"
    post:
      operationId: createWorkout
      tags: [workouts]
      summary: Create a workout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutRequest"
      responses:
        "201":
          description: Workout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"

  /workouts/{id}:
    put:
      operationId: updateWorkout
      tags: [workouts]
      summary: Update workout
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutRequest"
      responses:
        "200":
          description: Updated workout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
    delete:
      operationId: deleteWorkout
      tags: [workouts]
      summary: Delete workout
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /workouts/{id}/assign:
    post:
      operationId: assignWorkout
      tags: [workouts]
      summary: Assign workout to students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignWorkoutRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /workouts/{id}/complete:
    post:
      operationId: completeWorkout
      tags: [workouts]
      summary: Mark workout as completed today
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /gamification/streak:
    get:
      operationId: getStreak
      tags: [gamification]
      summary: Get streak data for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Streak data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakData"

  /payments:
    get:
      operationId: getPayments
      tags: [payments]
      summary: Get payments (own for student, all for admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, overdue]
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/generate:
    post:
      operationId: generatePayment
      tags: [payments]
      summary: Generate a Pix payment for a student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePaymentRequest"
      responses:
        "201":
          description: Payment generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/webhook:
    post:
      operationId: paymentWebhook
      tags: [payments]
      summary: Simulate payment confirmation (webhook)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookRequest"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /plans/me:
    get:
      operationId: getMyPlan
      tags: [payments]
      summary: Get current student's active plan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [aluno, professor, admin]
        avatarUrl:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - createdAt

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [aluno, professor, admin]
        phone:
          type: string
      required:
        - name
        - email
        - password
        - role

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string

    Exercise:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sets:
          type: integer
        reps:
          type: string
        restSeconds:
          type: integer
      required:
        - id
        - name
        - sets
        - reps

    Workout:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        muscleGroups:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        isCustom:
          type: boolean
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - isCustom
        - exercises
        - createdAt

    CreateWorkoutRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        muscleGroups:
          type: string
        isCustom:
          type: boolean
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/CreateExerciseRequest"
      required:
        - name
        - exercises

    CreateExerciseRequest:
      type: object
      properties:
        name:
          type: string
        sets:
          type: integer
        reps:
          type: string
        restSeconds:
          type: integer
      required:
        - name
        - sets
        - reps

    AssignWorkoutRequest:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
      required:
        - userIds

    StreakData:
      type: object
      properties:
        currentStreak:
          type: integer
        maxStreak:
          type: integer
        trainedToday:
          type: boolean
        weekDays:
          type: array
          items:
            type: boolean
          minItems: 7
          maxItems: 7
      required:
        - currentStreak
        - maxStreak
        - trainedToday
        - weekDays

    Payment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
          nullable: true
        amount:
          type: number
        status:
          type: string
          enum: [pending, paid, overdue]
        dueDate:
          type: string
          format: date
        paidAt:
          type: string
          format: date-time
          nullable: true
        pixQrCode:
          type: string
          nullable: true
        pixCopyPaste:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - amount
        - status
        - dueDate
        - createdAt

    GeneratePaymentRequest:
      type: object
      properties:
        userId:
          type: string
        amount:
          type: number
        dueDate:
          type: string
          format: date
      required:
        - userId
        - amount
        - dueDate

    PaymentWebhookRequest:
      type: object
      properties:
        paymentId:
          type: string
      required:
        - paymentId

    Plan:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        planName:
          type: string
        price:
          type: number
        active:
          type: boolean
        nextDueDate:
          type: string
          format: date
          nullable: true
      required:
        - id
        - userId
        - planName
        - price
        - active
